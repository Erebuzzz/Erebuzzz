<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Erebus Codex &middot; Manuscript Routing</title>
    <script type="text/javascript">
      // GitHub Pages SPA Single Page App redirect script
      var l = window.location;
      var path = l.pathname;
      var search = l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '';
      var hash = l.hash ? '&hash=' + encodeURIComponent(l.hash) : '';
      var destination = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + '/?p=' + encodeURIComponent(path) + search + hash;
      l.replace(destination);
    </script>
  </head>
  <body style="background-color: #07080b; color: #f59e0b; font-family: 'Cinzel', serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
    <div style="text-align: center;">
      <p style="font-size: 1.25rem; letter-spacing: 0.1em;">&#9889; CONSULTING THE ORACLE &middot; UNROLLING FOLIO...</p>
    </div>
  </body>
</html>
